name: Fix congressional mobile selected state
on:
  push:
    branches: [fix/congressional-mobile-selected-state]
    paths: ['.github/workflows/apply-congressional-selected.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make congressional taps selected, not hover
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          begin = s.index('async function renderDistrictHover(')
          end = s.index('\n    function ', begin)
          section = s[begin:end]
          old = '`Hover: ${panelDistrictLabel} ${displayDistrictNum}`'
          new = '`${scope === "congressional" && isTouchInteractionMode() && (forceTooltip || tooltipPinned) ? "Selected" : "Hover"}: ${panelDistrictLabel} ${displayDistrictNum}`'
          if section.count(old) != 1: raise SystemExit('District hover counter label anchor changed')
          section = section.replace(old, new)
          s = s[:begin] + section + s[end:]
          marker = "// Render and pin the touch tooltip before the camera moves."
          begin = s.index(marker)
          end = s.index("await zoomToDistrictSelection('congressional'", begin)
          section = s[begin:end]
          if section.count('setTooltipPinned(false);') != 1:
              raise SystemExit('Congressional tap pin anchor changed')
          section = section.replace('setTooltipPinned(false);', 'setTooltipPinned(true);', 1)
          s = s[:begin] + section + s[end:]
          s, n = re.subn(r"const DATA_CACHE_BUSTER = '[^']+';", "const DATA_CACHE_BUSTER = '2026-10-28-congressional-selected-mobile-v7';", s, count=1)
          if n != 1: raise SystemExit('Cachebuster declaration not found')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-congressional-selected.yml').unlink()
      - name: Commit updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-congressional-selected.yml
          git commit -m "Use selected state for congressional mobile taps"
          git push
